<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin - kisah kita</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }
      body {
        background:
          linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)),
          url("https://images.unsplash.com/photo-1519741497674-611481863552?ixlib=rb-4.0.3")
            center/cover;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-box {
        background: #1a1a1a;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 400px;
        text-align: center;
        color: white;
        border-top: 5px solid #cda434;
      }
      .logo {
        font-family: "Playfair Display", serif;
        font-size: 24px;
        margin-bottom: 30px;
      }
      .logo span {
        color: #cda434;
      }
      .input-group {
        margin-bottom: 20px;
        text-align: left;
      }
      .input-group label {
        display: block;
        font-size: 0.85rem;
        color: #ccc;
        margin-bottom: 5px;
      }
      .input-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #444;
        border-radius: 5px;
        background: #2a2a2a;
        color: white;
        outline: none;
      }
      .input-group input:focus {
        border-color: #cda434;
      }
      .btn-login {
        width: 100%;
        padding: 12px;
        background: #cda434;
        color: white;
        border: none;
        border-radius: 5px;
        font-weight: 500;
        cursor: pointer;
        margin-top: 10px;
        transition: 0.3s;
      }
      .btn-login:hover {
        background: #b58d2a;
      }
      .error-msg {
        background: #ff4c4c;
        color: white;
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 20px;
        font-size: 0.85rem;
      }
      .back-link {
        display: inline-block;
        margin-top: 20px;
        color: #888;
        font-size: 0.85rem;
        text-decoration: none;
      }
      .back-link:hover {
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <div class="logo">kisah <span>kita </span></div>
      <p style="margin-bottom: 25px; font-size: 0.9rem; color: #ccc">
        Silakan masuk untuk mengakses panel pesanan.
      </p>

      <!-- Pesan Error jika password salah -->
      {% with messages = get_flashed_messages(category_filter=["error"]) %} {%
      if messages %}
      <div class="error-msg">{{ messages[0] }}</div>
      {% endif %} {% endwith %}

      <form action="/login" method="POST">
        <div class="input-group">
          <label>Username</label>
          <input type="text" name="username" required autocomplete="off" />
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" name="password" required />
        </div>
        <button type="submit" class="btn-login">Masuk ke Admin</button>
      </form>
      <a href="/" class="back-link">&larr; Kembali ke halaman utama</a>
    </div>
  </body>
</html>
